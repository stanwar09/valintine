<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Chetna babu ❤️</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      text-align: center;
      color: white;
    }

    h1 {
      margin-top: 80px;
      font-size: 2.2rem;
    }

    .buttons {
      position: relative;
      width: 100%;
      height: 60vh;
    }

    button {
      padding: 14px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      position: absolute;
      transition: 0.2s;
    }

    #yes {
      background: #28a745;
      color: white;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    #no {
      background: #dc3545;
      color: white;
      left: 30%;
      top: 65%;
    }

    #message {
      display: none;
      font-size: 2rem;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <h1>Chetna babu ❤️  
    <br>Will you be my Valentine? 💖
  </h1>

  <div class="buttons">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙄</button>
  </div>

  <div id="message">
    Yayyy!! 💃💖  
    <br>You made me the happiest! 🥰
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");

    noBtn.addEventListener("mouseover", moveNo);
    noBtn.addEventListener("touchstart", moveNo);

    function moveNo() {
      const yesRect = yesBtn.getBoundingClientRect();
      const noRect = noBtn.getBoundingClientRect();

      let x = Math.random() * (window.innerWidth - noRect.width);
      let y = Math.random() * (window.innerHeight - noRect.height);

      const dx = x - yesRect.left;
      const dy = y - yesRect.top;
      const distance = Math.sqrt(dx * dx + dy * dy);

      // If No comes too close to Yes → push it away
      if (distance < 150) {
        x += dx > 0 ? 150 : -150;
        y += dy > 0 ? 150 : -150;
      }

      // Keep No inside screen
      x = Math.max(10, Math.min(x, window.innerWidth - noRect.width - 10));
      y = Math.max(10, Math.min(y, window.innerHeight - noRect.height - 10));

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    yesBtn.addEventListener("click", () => {
      document.querySelector(".buttons").style.display = "none";
      message.style.display = "block";
    });
  </script>

</body>
</html>
