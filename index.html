

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Be My Valentine 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffd6e8, #ffeef6);
      font-family: Poppins, Arial, sans-serif;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 340px;
      position: relative;
    }

    .emoji {
      font-size: 70px;
    }

    h2 {
      margin: 20px 0 30px;
    }

    .buttons {
      position: relative;
      height: 60px;
    }

    button {
      padding: 12px 26px;
      font-size: 16px;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      position: absolute;
      transition: 0.3s;
    }

    #yes {
      background: #ff4d6d;
      color: white;
      left: 40px;
    }

    #no {
      background: #ddd;
      left: 180px;
    }

    #surprise {
      display: none;
      margin-top: 25px;
    }

    #surprise img {
      width: 200px;
      border-radius: 15px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="emoji">🐱💖</div>
  <h2>Nirali, will you be my Valentine?</h2>

  <div class="buttons">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <div id="surprise">
    <h3>Yaaay! 🎉💘</h3>
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
  </div>
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const surprise = document.getElementById("surprise");

  function moveNo() {
    noBtn.style.left = Math.random() * 140 + "px";
    noBtn.style.top = Math.random() * 20 + "px";
  }

  noBtn.addEventListener("mouseover", moveNo);
  noBtn.addEventListener("click", moveNo);

  yesBtn.addEventListener("click", () => {
    surprise.style.display = "block";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
  });
</script>

</body>
</html>
